# Truss that already speaks Protocol 1 against a stub model.
# Copy this directory, do not edit it. Both ASR lanes copy it so promoting the
# winner is a change to ASR_WS_URL and nothing else.
model_name: voicebridge-asr-template
python_version: py311
requirements:
  - numpy
resources:
  accelerator: H100
  use_gpu: true
runtime:
  predict_concurrency: 4
  # A load() slower than the default startup window leaves the replica marked
  # unhealthy: the deployment reports ACTIVE, the router refuses every
  # handshake with a 500, and nothing reaches the container to be logged.
  health_checks:
    startup_threshold_seconds: 600
  # `is_websocket_endpoint` is deprecated and inferred from this. Setting the
  # old key alone leaves the route unregistered and every handshake 500s.
  transport:
    kind: websocket
environment_variables: {}
secrets: {}
