# Cohere lane. Copied from serve/_template, Recognizer replaced, protocol
# untouched: promoting a winner must stay a change to ASR_WS_URL and nothing else.
model_name: voicebridge-asr-cohere
python_version: py311
requirements:
  - numpy
  - torch
  - transformers
  - peft
  - librosa
  - sentencepiece
  - soundfile
resources:
  accelerator: H100
  use_gpu: true
runtime:
  predict_concurrency: 4
  is_websocket_endpoint: true
environment_variables:
  # The 13.7 MB adapter ships inside the Truss rather than being fetched at
  # boot: no network dependency on cold start, and the served weights are
  # pinned to the exact checkpoint the sealed test measured.
  # Resolved relative to the Truss root at runtime; see model.py.
  COHERE_ADAPTER_PATH: packages/adapter
secrets:
  hf_token: null
