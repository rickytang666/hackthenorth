[project]
name = "voicebridge-voice"
version = "0.1.0"
description = "OpenVoice V2 renderer behind Protocol 2"
# Isolated from the training environment on purpose: OpenVoice pins numpy<2
# while the ASR stack needs numpy>=2. Separate service, separate process.
#
# We do NOT install myshell-openvoice from its pyproject: it pins gradio 3.48
# and faster-whisper 0.9, dragging in av==10 which no longer Cython-compiles.
# Those are for its demo web UI. Tone-color conversion needs only the list
# below plus the repo's source, vendored by fetch_openvoice.sh.
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy<2",
    "torch>=2.0",
    "torchaudio>=2.0",
    "soundfile>=0.12",
    "librosa==0.9.1",  # pinned by MeloTTS
    "inflect>=7.0",
    "unidecode>=1.3",
    "eng-to-ipa>=0.0.2",
    "cn2an>=0.5",
    "jieba>=0.42",
    "pypinyin>=0.50",
    "whisper-timestamped>=1.14",
    "wavmark>=0.0.3",
    "setuptools<81",  # librosa 0.9.1 imports pkg_resources, dropped in setuptools 81
    "melotts",
]

[tool.uv.sources]
melotts = { git = "https://github.com/myshell-ai/MeloTTS.git" }

[tool.uv]
package = false
