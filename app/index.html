<script>
const SAMPLE_RATE = 16000, FRAME = 320;        // 320 samples = 20 ms
const CLARIFY_BELOW = 0.879;                   // calibrated on F04; see contract/confidence.py
const $ = id => document.getElementById(id);

let clips = [], current = null, ws = null, began = 0, sawPartial = false;
let voiceId = null, enrolling = null;

const setStatus = t => { $('status').textContent = t; };

// One AudioContext for the page. Browsers cap how many you may create, and the
// old code leaked two per utterance.
let audioCtx = null;
const ac = () => (audioCtx ??= new AudioContext({ sampleRate: SAMPLE_RATE }));

// Locate the data chunk rather than assuming a 44-byte header; TORGO WAVs
// carry a LIST chunk ahead of it.
function pcmOf(raw) {
  const view = new DataView(raw);
  if (view.getUint32(0, false) !== 0x52494646) throw new Error('not a RIFF file');
  let off = 12;
  while (off + 8 <= raw.byteLength) {
    const id = view.getUint32(off, false), size = view.getUint32(off + 4, true);
    if (id === 0x64617461) return new Int16Array(raw, off + 8, size >> 1);
    off += 8 + size + (size & 1);
  }
  throw new Error('no data chunk');
}

function drawWave(canvas, channel) {
  const w = canvas.width, h = canvas.height, ctx = canvas.getContext('2d');
  const step = Math.floor(channel.length / w) || 1;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#888';
  for (let x = 0; x < w; x++) {
    let peak = 0;
    for (let i = x * step; i < (x + 1) * step && i < channel.length; i++) {
      const v = Math.abs(channel[i]);
      if (v > peak) peak = v;
    }
    const bar = Math.max(1, peak * h);
    ctx.fillRect(x, (h - bar) / 2, 1, bar);
  }
}

async function loadClips() {
  clips = await (await fetch('clips/manifest.json')).json();
  const box = $('clips');
  for (const [i, clip] of clips.entries()) {
    const b = document.createElement('button');
    b.setAttribute('aria-pressed', 'false');
    b.title = `${clip.duration_s}s`;
    const c = document.createElement('canvas');
    c.width = 84; c.height = 26;
    b.append(c, document.createTextNode(
      `${clip.video ? '▶' : i + 1} · ${clip.duration_s}s`));
    b.onclick = () => select(i);
    box.append(b);
    const raw = await (await fetch(clip.wav)).arrayBuffer();
    // Keep the file's own samples for the wire. Decoding to float and
    // requantizing changes them just enough to flip a low-confidence word.
    clip.pcm = pcmOf(raw);
    const buf = await ac().decodeAudioData(raw.slice(0));
    clip.buffer = buf;                                  // playback and waveform only
    drawWave(c, buf.getChannelData(0));
  }
  setStatus('pick a clip');
}

async function select(i) {
  current = clips[i];
  [...$('clips').children].forEach((b, j) =>
    b.setAttribute('aria-pressed', String(j === i)));
  showChips();
  const viewer = $('viewer'), video = $('video');
  if (current.video) {
    video.src = current.video;
    video.load();
    viewer.style.display = 'block';
  } else {
    video.removeAttribute('src');
    viewer.style.display = 'none';
  }
  $('run').disabled = $('original').disabled = false;
  clearTranscript('Ready. Press Recover speech.');
  $('reference').textContent = $('baseline').textContent = '';
  $('clarify').hidden = true;
  setStatus('ready');
  enrolling = enroll(current);        // start the clone now so beat 5 is not waiting on it
}

// The sealed-test aggregate, so the seven clips read as a sample of a measured
// population rather than a lucky handful. Numbers are from docs/RESULTS.md.
const SEALED = { speaker: 'M02', clips: 388, baseline: 0.567, tuned: 0.348 };

function showChips() {
  const box = $('caption');
  box.textContent = '';
  const chip = html => {
    const el = document.createElement('span');
    el.className = 'chip';
    el.innerHTML = html;
    box.append(el);
  };
  if (current.video) {
    chip(`<b>${current.label || 'video'}</b>`);
    chip('unscripted, outside the corpus');
    chip(`<b>${current.duration_s}</b> s`);
    return;
  }
  chip(`speaker <b>${SEALED.speaker}</b>`);
  chip('sealed test, never trained on');
  chip(`<b>${SEALED.clips}</b> clips`);
  chip(`WER <b>${SEALED.baseline.toFixed(3)}</b>`
       + `<span class="arrow">\u2192</span><b>${SEALED.tuned.toFixed(3)}</b>`);
}

// A video source plays through its own element so picture and sound stay
// together; everything else goes through the shared AudioContext.
function playOriginal() {
  if (current.video) {
    const v = $('video');
    v.currentTime = 0;
    return v.play();
  }
  return play(current.buffer);
}

function play(buffer) {
  const src = ac().createBufferSource();
  src.buffer = buffer;
  src.connect(ac().destination);
  src.start();
  return src;
}

// Protocol 2, step 1. The renderer needs a reference of this speaker before it
// can synthesize as them; without it /v1/synthesize answers 409.
async function enroll(clip) {
  const base = $('voiceUrl').value.replace(/\/$/, '');
  const bytes = new Uint8Array(await (await fetch(clip.wav)).arrayBuffer());
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  const r = await fetch(base + '/v1/enroll', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ wavs_b64: [btoa(bin)] }),
  });
  if (!r.ok) throw new Error(`enroll ${r.status}`);
  voiceId = (await r.json()).voice_id;
  return voiceId;
}

async function speak(text) {
  const base = $('voiceUrl').value.replace(/\/$/, '');
  // Timed from here, not from the start of the stream: a clarification can sit
  // on screen for as long as the person takes, and that is not our latency.
  const asked = performance.now();
  try {
    const id = await enrolling;
    const r = await fetch(base + '/v1/synthesize', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, voice_id: id }),
    });
    if (!r.ok) throw new Error(`synthesize ${r.status} ${await r.text()}`);
    const buf = await ac().decodeAudioData(await r.arrayBuffer());
    stat('synth', performance.now() - asked);
    play(buf);
  } catch (e) {
    stat('synth', 0);
    setStatus('voice renderer: ' + e.message);
  }
}

function showConfidence(value) {
  $('confVal').textContent = value.toFixed(3);
  $('confFill').style.width = Math.round(value * 100) + '%';
  $('confTick').style.left = (CLARIFY_BELOW * 100) + '%';   // the accept threshold
  $('confWrap').hidden = false;
}

// A waterfall rather than a row of numbers: the point is which stage costs what,
// and three bare millisecond figures do not show that at a glance.
const STAGES = [
  { key: 'capture', label: 'audio to first partial', shade: '#c9c9c9' },
  { key: 'decode', label: 'partial to final', shade: '#8a8a8a' },
  { key: 'synth', label: 'synthesis', shade: '#3a3a3a' },
];
const timings = {};

function drawLatency() {
  const total = STAGES.reduce((sum, s) => sum + (timings[s.key] || 0), 0) || 0;
  const fall = $('fall'), legend = $('legend');
  fall.textContent = '';
  legend.textContent = '';
  for (const stage of STAGES) {
    const ms = timings[stage.key];
    if (!ms) continue;
    const seg = document.createElement('span');
    seg.style.width = (100 * ms / total) + '%';
    seg.style.background = stage.shade;
    seg.title = `${stage.label} ${Math.round(ms)} ms`;
    fall.append(seg);
    const item = document.createElement('span');
    item.innerHTML = `<i style="background:${stage.shade}"></i>${stage.label} `
                   + `<b>${Math.round(ms)} ms</b>`;
    legend.append(item);
  }
  if (total) {
    const sum = document.createElement('span');
    sum.innerHTML = `total <b>${Math.round(total)} ms</b>`;
    legend.append(sum);
  }
}

function stat(key, value) {
  timings[key] = value;
  drawLatency();
}

function showModel(id) {
  $('modelRow').hidden = !id;
  $('model').textContent = id || '-';
  const logo = $('modelLogo');
  const isCohere = /cohere/i.test(id || '');
  if (isCohere) logo.src = COHERE_LOGO;
  logo.style.display = isCohere ? 'inline' : 'none';
}

function clearTranscript(message) {
  $('transcript').innerHTML = `<span class="muted">${message}</span>`;
}

function render(text, stableLen) {
  const el = $('transcript');
  el.textContent = '';
  const cut = Math.max(0, Math.min(stableLen ?? text.length, text.length));
  el.append(document.createTextNode(text.slice(0, cut)));
  if (cut < text.length) {
    const s = document.createElement('span');
    s.className = 'tail';           // past stable_prefix_len, still revisable
    s.textContent = text.slice(cut);
    el.append(s);
  }
}

function showComparison() {
  const put = (id, key, value) => {
    const el = $(id);
    el.textContent = '';
    const k = document.createElement('span');
    k.className = 'k';
    k.textContent = key;
    el.append(k, document.createTextNode(value));
  };
  if (current.truth) put('reference', 'Ground truth', current.truth);
  if (current.baseline) put('baseline', 'Frozen baseline', current.baseline);
}

function accept(text) {
  render(text, text.length);
  $('clarify').hidden = true;
  showComparison();
  speak(text);
}

function showClarify(candidates) {
  const box = $('choices');
  box.textContent = '';
  // Framed as a confirmation, not a menu. The model's own best guess is first
  // and primary; the rest are there because weak evidence should be visible,
  // not because the model is undecided.
  $('clarifyLabel').textContent = candidates.length > 1
    ? 'Below the accept threshold. Confirm the top reading, or pick another.'
    : 'Below the accept threshold. Confirm before speaking.';
  for (const c of candidates.slice(0, 3)) {
    const b = document.createElement('button');
    b.textContent = c.text;
    b.onclick = () => accept(c.text);
    box.append(b);
  }
  $('clarify').hidden = false;
}

function connect() {
  return new Promise((resolve, reject) => {
    // Always a local URL. app/serve.py holds the API key and adds the
    // Authorization header upstream, because a browser cannot set one and a
    // subprotocol is not a legal place to put a key.
    ws = new WebSocket($('url').value);
    ws.onopen = () => { setStatus('streaming'); resolve(); };
    ws.onerror = () => { setStatus('connection failed'); reject(new Error('ws')); };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === 'partial') {
        if (!sawPartial) {
          sawPartial = true;
          stat('capture', performance.now() - began);
        }
        render(m.text, m.stable_prefix_len);
      } else if (m.type === 'final') {
        stat('decode', performance.now() - began - (timings.capture || 0));
        showModel(m.model_id);
        setStatus('done');
        showConfidence(m.confidence ?? 0);
        if ((m.confidence ?? 1) < CLARIFY_BELOW) {
          render(m.text, m.text.length);
          showComparison();
          const alts = m.candidates?.length ? m.candidates : [{ text: m.text }];
          alts.sort((a, b) => (b.text === m.text) - (a.text === m.text));
          showClarify(alts);
        } else {
          accept(m.text);
        }
        ws.close();
      } else if (m.type === 'error') {
        setStatus('error: ' + m.message);
      }
    };
  });
}

function sendPcm(pcm) {
  if (!ws || ws.readyState !== 1) return;
  const bytes = new Uint8Array(pcm.buffer, pcm.byteOffset, pcm.byteLength);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  ws.send(JSON.stringify({ type: 'audio', pcm16_b64: btoa(bin) }));
}

async function run() {
  if (!current) return;
  $('run').disabled = true;
  sawPartial = false;
  clearTranscript('Listening\u2026');
  $('reference').textContent = $('baseline').textContent = '';
  $('clarify').hidden = true;
  for (const k of Object.keys(timings)) delete timings[k];
  drawLatency();
  showModel('');
  $('confWrap').hidden = true;
  try { await connect(); } catch { $('run').disabled = false; return; }
  began = performance.now();
  // The room hears the distorted original while the text resolves against it.
  // Synthesis lands about a second after this finishes, so the two never overlap.
  playOriginal();
  const d = current.pcm;
  for (let o = 0, frame = 0; o < d.length; o += FRAME, frame++) {
    sendPcm(d.subarray(o, o + FRAME));
    // Paced against the wall clock, not a flat 20 ms sleep. setTimeout always
    // overshoots, which drifted the transcript seconds behind the audio.
    const due = began + (frame + 1) * 20;
    const wait = due - performance.now();
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
  }
  if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'end' }));
  $('run').disabled = false;
}

// Deliberately a separate button. Synthesis lands a second after the clip ends,
// so the room hears only the recovered voice unless someone asks for the original.
$('original').onclick = () => current && playOriginal();
$('run').onclick = run;
loadClips();
</script>
