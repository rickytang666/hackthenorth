<!doctype html>
<meta charset="utf-8">
<title>VoiceBridge</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0 auto; padding: 20px; max-width: 820px; font-family: system-ui, sans-serif;
         font-size: 15px; line-height: 1.5 }
  h1 { font-size: 17px; margin: 0 0 16px; font-weight: 600 }
  fieldset { border: 1px solid #ccc; margin: 0 0 14px; padding: 10px 12px }
  legend { font-size: 12px; color: #555; padding: 0 4px }
  #clips { display: flex; flex-wrap: wrap; gap: 6px }
  #clips button { padding: 4px; background: #fff; border: 1px solid #ccc; cursor: pointer;
                  font: inherit; font-size: 12px; color: #555; line-height: 1 }
  #clips button[aria-pressed="true"] { border-color: #000; color: #000 }
  #clips canvas { display: block }
  #transcript { font-size: 24px; line-height: 1.3; min-height: 2.6em }
  #transcript .tail { color: #999 }
  .was { color: #777; margin-top: 8px }
  .was s { color: #777 }
  #clarify[hidden] { display: none }
  #choices button { display: block; width: 100%; text-align: left; margin-top: 6px;
                    padding: 6px 8px; font: inherit; background: #fff; border: 1px solid #666;
                    cursor: pointer }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
  button, input { font: inherit }
  button { padding: 5px 12px }
  input[type=text], input[type=password] { padding: 4px 6px; border: 1px solid #ccc;
                                           min-width: min(340px, 100%) }
  label { font-size: 12px; color: #555 }
  #stats { font-size: 13px; color: #555; font-variant-numeric: tabular-nums }
  #status { font-size: 13px; color: #555 }
  .note { font-size: 12px; color: #777; margin: 0 }
</style>

<body>
<h1>VoiceBridge</h1>

<fieldset>
  <legend>Clip</legend>
  <div id="clips"></div>
  <p class="note" id="caption"></p>
  <div class="row" style="margin-top:8px">
    <button id="run" disabled>Recover speech</button>
    <button id="original" disabled>Play original</button>
    <span id="status">pick a clip</span>
  </div>
</fieldset>

<fieldset>
  <legend>Recovered text</legend>
  <div id="transcript"></div>
  <p class="was" id="was"></p>
</fieldset>

<fieldset id="clarify" hidden>
  <legend>Low confidence</legend>
  <div>Not sure. Which did you mean?</div>
  <div id="choices"></div>
</fieldset>

<fieldset>
  <legend>Timing</legend>
  <div id="stats">first partial - &middot; final - &middot; spoken - &middot; model -</div>
</fieldset>

<fieldset>
  <legend>Endpoints</legend>
  <div class="row"><label for="url">ASR</label>
    <input type="text" id="url" value="ws://127.0.0.1:8765" spellcheck="false"></div>
  <div class="row" style="margin-top:6px"><label for="voiceUrl">Voice</label>
    <input type="text" id="voiceUrl" value="http://127.0.0.1:8770" spellcheck="false"></div>
</fieldset>

<script>
const SAMPLE_RATE = 16000, FRAME = 320;        // 320 samples = 20 ms
const CLARIFY_BELOW = 0.879;                   // calibrated on F04; see contract/confidence.py
const $ = id => document.getElementById(id);

let clips = [], current = null, ws = null, began = 0, sawPartial = false;
let voiceId = null, enrolling = null;

const setStatus = t => { $('status').textContent = t; };

// One AudioContext for the page. Browsers cap how many you may create, and the
// old code leaked two per utterance.
let audioCtx = null;
const ac = () => (audioCtx ??= new AudioContext({ sampleRate: SAMPLE_RATE }));

// Locate the data chunk rather than assuming a 44-byte header; TORGO WAVs
// carry a LIST chunk ahead of it.
function pcmOf(raw) {
  const view = new DataView(raw);
  if (view.getUint32(0, false) !== 0x52494646) throw new Error('not a RIFF file');
  let off = 12;
  while (off + 8 <= raw.byteLength) {
    const id = view.getUint32(off, false), size = view.getUint32(off + 4, true);
    if (id === 0x64617461) return new Int16Array(raw, off + 8, size >> 1);
    off += 8 + size + (size & 1);
  }
  throw new Error('no data chunk');
}

function drawWave(canvas, channel) {
  const w = canvas.width, h = canvas.height, ctx = canvas.getContext('2d');
  const step = Math.floor(channel.length / w) || 1;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#888';
  for (let x = 0; x < w; x++) {
    let peak = 0;
    for (let i = x * step; i < (x + 1) * step && i < channel.length; i++) {
      const v = Math.abs(channel[i]);
      if (v > peak) peak = v;
    }
    const bar = Math.max(1, peak * h);
    ctx.fillRect(x, (h - bar) / 2, 1, bar);
  }
}

async function loadClips() {
  clips = await (await fetch('clips/manifest.json')).json();
  const box = $('clips');
  for (const [i, clip] of clips.entries()) {
    const b = document.createElement('button');
    b.setAttribute('aria-pressed', 'false');
    b.title = `${clip.duration_s}s`;
    const c = document.createElement('canvas');
    c.width = 96; c.height = 28;
    b.append(c, document.createTextNode(`${i + 1} · ${clip.duration_s}s`));
    b.onclick = () => select(i);
    box.append(b);
    const raw = await (await fetch(clip.wav)).arrayBuffer();
    // Keep the file's own samples for the wire. Decoding to float and
    // requantizing changes them just enough to flip a low-confidence word.
    clip.pcm = pcmOf(raw);
    const buf = await ac().decodeAudioData(raw.slice(0));
    clip.buffer = buf;                                  // playback and waveform only
    drawWave(c, buf.getChannelData(0));
  }
  setStatus('pick a clip');
}

async function select(i) {
  current = clips[i];
  [...$('clips').children].forEach((b, j) =>
    b.setAttribute('aria-pressed', String(j === i)));
  $('caption').textContent =
    `M02, sealed test speaker. Frozen baseline scores 0.567 WER over all 388 clips, tuned 0.348.`;
  $('run').disabled = $('original').disabled = false;
  $('transcript').textContent = '';
  $('was').textContent = '';
  $('clarify').hidden = true;
  setStatus('ready');
  enrolling = enroll(current);        // start the clone now so beat 5 is not waiting on it
}

function play(buffer) {
  const src = ac().createBufferSource();
  src.buffer = buffer;
  src.connect(ac().destination);
  src.start();
  return src;
}

// Protocol 2, step 1. The renderer needs a reference of this speaker before it
// can synthesize as them; without it /v1/synthesize answers 409.
async function enroll(clip) {
  const base = $('voiceUrl').value.replace(/\/$/, '');
  const bytes = new Uint8Array(await (await fetch(clip.wav)).arrayBuffer());
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  const r = await fetch(base + '/v1/enroll', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ wavs_b64: [btoa(bin)] }),
  });
  if (!r.ok) throw new Error(`enroll ${r.status}`);
  voiceId = (await r.json()).voice_id;
  return voiceId;
}

async function speak(text) {
  const base = $('voiceUrl').value.replace(/\/$/, '');
  // Timed from here, not from the start of the stream: a clarification can sit
  // on screen for as long as the person takes, and that is not our latency.
  const asked = performance.now();
  try {
    const id = await enrolling;
    const r = await fetch(base + '/v1/synthesize', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, voice_id: id }),
    });
    if (!r.ok) throw new Error(`synthesize ${r.status} ${await r.text()}`);
    const buf = await ac().decodeAudioData(await r.arrayBuffer());
    stat('spoken', Math.round(performance.now() - asked) + ' ms');
    play(buf);
  } catch (e) {
    stat('spoken', 'failed');
    setStatus('voice renderer: ' + e.message);
  }
}

const timings = { 'first partial': '-', 'final': '-', 'spoken': '-', 'model': '-' };
function stat(key, value) {
  timings[key] = value;
  $('stats').textContent = Object.entries(timings)
    .map(([k, v]) => `${k} ${v}`).join(' · ');
}

function render(text, stableLen) {
  const el = $('transcript');
  el.textContent = '';
  const cut = Math.max(0, Math.min(stableLen ?? text.length, text.length));
  el.append(document.createTextNode(text.slice(0, cut)));
  if (cut < text.length) {
    const s = document.createElement('span');
    s.className = 'tail';           // past stable_prefix_len, still revisable
    s.textContent = text.slice(cut);
    el.append(s);
  }
}

function showBaseline() {
  $('was').textContent = `Frozen baseline heard: "${current.baseline}"`;
}

function accept(text) {
  render(text, text.length);
  $('clarify').hidden = true;
  showBaseline();
  speak(text);
}

function showClarify(candidates) {
  const box = $('choices');
  box.textContent = '';
  for (const c of candidates.slice(0, 3)) {
    const b = document.createElement('button');
    b.textContent = c.text;
    b.onclick = () => accept(c.text);
    box.append(b);
  }
  $('clarify').hidden = false;
}

function connect() {
  return new Promise((resolve, reject) => {
    // Always a local URL. app/serve.py holds the API key and adds the
    // Authorization header upstream, because a browser cannot set one and a
    // subprotocol is not a legal place to put a key.
    ws = new WebSocket($('url').value);
    ws.onopen = () => { setStatus('streaming'); resolve(); };
    ws.onerror = () => { setStatus('connection failed'); reject(new Error('ws')); };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === 'partial') {
        if (!sawPartial) {
          sawPartial = true;
          stat('first partial', Math.round(performance.now() - began) + ' ms');
        }
        render(m.text, m.stable_prefix_len);
      } else if (m.type === 'final') {
        stat('final', Math.round(performance.now() - began) + ' ms');
        stat('model', m.model_id ?? '-');
        setStatus(`confidence ${(m.confidence ?? 0).toFixed(3)}`);
        if ((m.confidence ?? 1) < CLARIFY_BELOW) {
          render(m.text, m.text.length);
          showBaseline();
          const alts = m.candidates?.length ? m.candidates : [{ text: m.text }];
          alts.sort((a, b) => (b.text === m.text) - (a.text === m.text));
          showClarify(alts);
        } else {
          accept(m.text);
        }
        ws.close();
      } else if (m.type === 'error') {
        setStatus('error: ' + m.message);
      }
    };
  });
}

function sendPcm(pcm) {
  if (!ws || ws.readyState !== 1) return;
  const bytes = new Uint8Array(pcm.buffer, pcm.byteOffset, pcm.byteLength);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  ws.send(JSON.stringify({ type: 'audio', pcm16_b64: btoa(bin) }));
}

async function run() {
  if (!current) return;
  $('run').disabled = true;
  sawPartial = false;
  $('transcript').textContent = '';
  $('was').textContent = '';
  $('clarify').hidden = true;
  for (const k of Object.keys(timings)) timings[k] = '-';
  stat('model', '-');
  try { await connect(); } catch { $('run').disabled = false; return; }
  began = performance.now();
  // The room hears the distorted original while the text resolves against it.
  // Synthesis lands about a second after this finishes, so the two never overlap.
  play(current.buffer);
  const d = current.pcm;
  for (let o = 0, frame = 0; o < d.length; o += FRAME, frame++) {
    sendPcm(d.subarray(o, o + FRAME));
    // Paced against the wall clock, not a flat 20 ms sleep. setTimeout always
    // overshoots, which drifted the transcript seconds behind the audio.
    const due = began + (frame + 1) * 20;
    const wait = due - performance.now();
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
  }
  if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'end' }));
  $('run').disabled = false;
}

// Deliberately a separate button. Synthesis lands a second after the clip ends,
// so the room hears only the recovered voice unless someone asks for the original.
$('original').onclick = () => current && play(current.buffer);
$('run').onclick = run;
loadClips();
</script>
</body>
