<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceBridge clarification</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 11a8 8 0 1111 7c-3 1-3 3-3 5M16 27v1' fill='none' stroke='%23ff5a36' stroke-width='4'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink:#070806; --paper:#f1f0e8; --acid:#d7ff3f; --signal:#ff5a36;
      --muted:#92968b; --line:rgba(241,240,232,.18); --panel:#10120e;
      --display:"Avenir Next Condensed","DIN Condensed","Franklin Gothic Condensed",sans-serif;
      --body:"Avenir Next","Gill Sans",sans-serif;
    }
    * { box-sizing:border-box }
    html,body { width:100%; height:100%; overflow:hidden }
    body { margin:0; color:var(--paper); background:radial-gradient(circle at 8% 8%,rgba(255,90,54,.11),transparent 30%),#070806; font-family:var(--body) }
    button,select { font:inherit }
    .grain { position:fixed; inset:0; pointer-events:none; opacity:.2; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.08'/%3E%3C/svg%3E") }
    header { height:76px; padding:0 4vw; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between }
    .wordmark { font:800 18px/1 var(--display); letter-spacing:.18em }
    .wordmark i { display:inline-block; width:14px; height:14px; margin-right:10px; border:4px solid var(--acid); border-top-color:transparent; border-radius:50%; transform:rotate(-28deg); vertical-align:-2px }
    .principle { color:var(--muted); font:800 10px/1 var(--display); letter-spacing:.14em }
    .principle strong { color:var(--signal) }
    main { height:calc(100% - 132px); padding:30px 4vw 22px; display:grid; grid-template-rows:auto 1fr auto; gap:18px }
    .intro { display:flex; align-items:end; justify-content:space-between; gap:24px }
    .eyebrow { margin:0 0 9px; color:var(--signal); font:800 11px/1 var(--display); letter-spacing:.18em }
    h1 { margin:0; font:900 clamp(40px,5.5vw,84px)/.86 var(--display); letter-spacing:-.045em; text-transform:uppercase }
    h1 em { color:var(--acid); font-style:normal }
    .confidence { display:grid; justify-items:end; gap:5px }
    .confidence span { color:var(--muted); font:800 9px/1 var(--display); letter-spacing:.14em }
    .confidence strong { color:var(--signal); font:900 42px/1 var(--display) }
    #clarification { min-height:0 }
    .clarify-shell { height:100%; display:grid; grid-template-columns:minmax(150px,.36fr) 1.64fr; border:1px solid rgba(255,90,54,.45); background:linear-gradient(135deg,rgba(255,90,54,.1),rgba(16,18,14,.88) 35%) }
    .clarify-signal { position:relative; display:grid; place-items:center; border-right:1px solid rgba(255,90,54,.35); overflow:hidden }
    .clarify-signal::before,.clarify-signal::after { content:""; position:absolute; border:1px solid rgba(255,90,54,.25); border-radius:50% }
    .clarify-signal::before { width:78%; aspect-ratio:1 }
    .clarify-signal::after { width:54%; aspect-ratio:1 }
    .clarify-signal span { z-index:1; color:var(--signal); font:900 clamp(90px,13vw,190px)/1 var(--display); animation:breathe 1.4s ease-in-out infinite alternate }
    @keyframes breathe { to { transform:scale(1.06); text-shadow:0 0 40px rgba(255,90,54,.35) } }
    .clarify-content { padding:clamp(22px,3vw,42px); display:grid; align-content:center; grid-template-columns:1fr auto; column-gap:18px }
    .clarify-kicker { color:var(--signal); font:800 9px/1 var(--display); letter-spacing:.16em }
    .clarify-content h2 { grid-column:1/-1; margin:8px 0 3px; font:900 clamp(44px,6vw,92px)/.9 var(--display); letter-spacing:-.04em; text-transform:uppercase }
    .clarify-reason { margin:0; color:var(--muted); font-size:clamp(15px,1.4vw,22px) }
    .clarify-terms { display:flex; justify-content:end; gap:8px }
    .clarify-terms span { padding:7px 10px; border:1px solid var(--signal); color:var(--signal); font:900 10px/1 var(--display); letter-spacing:.14em }
    .clarify-options { grid-column:1/-1; margin-top:22px; display:grid; gap:10px }
    .clarify-options button { position:relative; min-height:74px; padding:12px 20px 12px 74px; border:1px solid var(--line); background:#10120e; color:var(--paper); text-align:left; cursor:pointer; transition:.16s ease }
    .clarify-options button:hover,.clarify-options button:focus-visible { border-color:var(--acid); outline:none; transform:translateX(4px) }
    .clarify-options button.selected { color:var(--ink); background:var(--acid); border-color:var(--acid) }
    .clarify-options button > span { position:absolute; left:20px; top:50%; transform:translateY(-50%); display:grid; place-items:center; width:34px; height:34px; border:1px solid currentColor; font:900 13px/1 var(--display) }
    .clarify-options strong { font:700 clamp(21px,2.2vw,34px)/1.08 var(--display) }
    .clarify-hint { grid-column:1/-1; margin:14px 0 0; color:var(--muted); font:800 8px/1 var(--display); letter-spacing:.15em }
    .controls { display:flex; align-items:center; gap:10px }
    .control { min-height:42px; padding:0 15px; border:1px solid var(--line); background:transparent; color:var(--paper); font:800 9px/1 var(--display); letter-spacing:.12em; cursor:pointer }
    .control:hover { border-color:var(--acid) }
    .control select { border:0; color:inherit; background:transparent; font:inherit }
    .result { margin-left:auto; min-width:340px; color:var(--muted); font:800 9px/1 var(--display); letter-spacing:.12em; text-align:right }
    .result strong { color:var(--acid); font-size:13px }
    footer { height:56px; padding:0 4vw; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; color:var(--muted); font:800 9px/1 var(--display); letter-spacing:.13em }
    footer strong { color:var(--acid) }
    kbd { padding:3px 6px; border:1px solid var(--line); border-bottom-width:2px; color:var(--paper); font:800 9px/1 var(--display) }
    @media (max-width:760px) {
      html,body { height:auto; overflow:auto }
      main { height:auto }
      .clarify-shell { grid-template-columns:1fr }
      .clarify-signal { min-height:150px; border-right:0; border-bottom:1px solid rgba(255,90,54,.35) }
      .clarify-signal span { font-size:100px }
      .clarify-content { grid-template-columns:1fr }
      .clarify-terms { justify-content:start; margin-top:12px }
      .result { width:100%; min-width:0; margin:0; text-align:left }
      .controls { flex-wrap:wrap }
    }
    @media (prefers-reduced-motion:reduce) { * { animation-duration:.01ms!important; transition-duration:.01ms!important } }
  </style>
  <link rel="stylesheet" href="static/report.css?v=3">
</head>
<body class="report-ui page-clarify">
  <div class="grain" aria-hidden="true"></div>
  <header>
    <div class="wordmark"><i></i>VOICEBRIDGE</div>
    <div class="principle">WHEN THE WORD CAN CHANGE THE OUTCOME, <strong>ASK.</strong></div>
  </header>
  <main>
    <div class="intro">
      <div>
        <p class="eyebrow">ABSTENTION IS THE FEATURE</p>
        <h1>Safe speech is<br><em>confirmed speech.</em></h1>
      </div>
      <div class="confidence"><span>MODEL CONFIDENCE</span><strong id="confidence">41%</strong></div>
    </div>
    <div id="clarification"></div>
    <div class="controls">
      <label class="control">SCENARIO
        <select id="scenario">
          <option value="0">Negation</option>
          <option value="1">Dosage</option>
          <option value="2">Medication</option>
          <option value="3">Low confidence</option>
        </select>
      </label>
      <button class="control" id="reset" type="button">RESET CHOICE</button>
      <div class="result" id="result">WAITING FOR CONFIRMATION</div>
    </div>
  </main>
  <footer>
    <span><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> CONFIRM · <kbd>R</kbd> RESET</span>
    <strong>THE VERIFIER CANNOT WRITE NEW TEXT</strong>
  </footer>
  <script src="static/clarify.js"></script>
  <script>
    const scenarios = [
      { confidence:.41, terms:['not','no','insulin'], candidates:['Do not give her the insulin.','Do give her the insulin.'] },
      { confidence:.56, terms:['5','15','milligrams'], candidates:['Take 5 milligrams tonight.','Take 15 milligrams tonight.'] },
      { confidence:.63, terms:['insulin','penicillin'], candidates:['I need my insulin.','I need my penicillin.'] },
      { confidence:.28, terms:['not','no','insulin'], candidates:['Please call the nurse.','Please call her first.','Please call after lunch.'] },
    ];
    const byId = id => document.getElementById(id);
    let controller;

    function showScenario() {
      controller?.destroy();
      const scenario=scenarios[Number(byId('scenario').value)];
      byId('confidence').textContent=`${Math.round(scenario.confidence*100)}%`;
      byId('result').textContent='WAITING FOR CONFIRMATION';
      controller=VoiceBridgeClarify.mount(byId('clarification'),{
        candidates:scenario.candidates,
        confidence:scenario.confidence,
        criticalTerms:scenario.terms,
        onConfirm(text) {
          byId('result').innerHTML='CONFIRMED EXACT CANDIDATE · <strong></strong>';
          byId('result').querySelector('strong').textContent=`“${text}”`;
        },
      });
    }

    const negation=VoiceBridgeClarify.criticalDisagreements(
      [{text:'Do not give insulin'},{text:'Do give insulin'}],['not','insulin']
    );
    if (negation.length!==1||negation[0]!=='not') throw new Error('critical disagreement self-check failed');

    byId('scenario').onchange=showScenario;
    byId('reset').onclick=showScenario;
    document.addEventListener('keydown',event=>{
      if (event.key.toLowerCase()==='r'&&!['INPUT','SELECT','BUTTON'].includes(event.target.tagName)) showScenario();
    });
    showScenario();
  </script>
</body>
</html>
