[project]
name = "voicebridge"
version = "0.1.0"
description = "Real-time speech recovery for dysarthric speech that preserves the speaker's voice"
requires-python = ">=3.11,<3.14"
dependencies = [
    "datasets>=5.0",
    "soundfile>=0.13",
    "jiwer>=4.0",
    "websockets>=17",
    "numpy>=2.0",
    "pyarrow>=21",
    "huggingface-hub[cli]>=1.0",
    "torch>=2.6",
    "transformers>=5.0",
    "peft>=0.17",
    "accelerate>=1.0",
    "librosa>=0.11.0",
    "sentencepiece>=0.2.2",
    "truss>=0.18.30",
    "fastapi>=0.141.1",
]

[tool.uv]
# Person B installs all dependencies. Regenerate uv.lock rather than merging it.
package = false
